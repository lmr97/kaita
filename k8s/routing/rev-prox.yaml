# Remember: you need one IngressRoute (at least)
# per namespace. You cannot use this one for 
# all apps, sadly.

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: main-rev-prox
  namespace: archie
  annotations:
    cert-manager.io/issuer: "letsencrypt-issuer"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  entryPoints:
    - web
  #tls:
  #  secretName: archie-tls-auto
  routes:
    #- kind: Rule
    #  match: Host(`archie`)
    #  services:
    #    - kind: Service
    #      name: echo-svr
    #      namespace: archie
    #      port: 8080

    - kind: Rule
      match: Host(`jellyfin.lmrsvr.net`)
      services:
        - kind: Service 
          name: jellyfin-longhorn
          namespace: archie
          port: 1997

    - kind: Rule
      match: Host(`lmrsvr.net`)
      services:
        - kind: Service
          name: archie-svr
          namespace: archie
          port: 4949

