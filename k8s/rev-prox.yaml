apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: main-rev-prox
  namespace: archie
  annotations:
    cert-manager.io/issuer: "letsencrypt-issuer"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  #tls:
  #  secretName: archie-tls-auto
  routes:
  - kind: Rule
    match: Host(`jellyfin.lmrsvr.net`)
    services:
    - kind: Service 
      name: jellyfin-longhorn
      namespace: archie
      port: 1997
  - kind: Rule
    match: Host(`lmrsvr.net`)
    services:
    - kind: Service
      name: archie-svr
      namespace: archie
      port: 4949

